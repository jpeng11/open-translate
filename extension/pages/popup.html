<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Translate</title><link rel="stylesheet" href="rare.css"><link rel="stylesheet" href="ui.css"></head><body class="popup">
<header class="popup-header"><div class="brand"><span class="mark">ot</span>Open Translate</div><span class="pill">Your AI</span><div class="popup-orb" id="popup-orb" aria-hidden="true"></div></header>
<div class="popup-languages"><div class="field"><label for="source">Original language</label><select id="source"></select></div><span aria-hidden="true">→</span><div class="field"><label for="target">Target language</label><select id="target"></select></div></div><datalist id="languages"></datalist>
<div class="popup-service"><div class="popup-service-row"><span>Service :</span><button class="ghost" id="service">Connect your AI ↗</button></div><div class="popup-service-row"><label for="mode">Page display :</label><select id="mode"><option value="bilingual">Bilingual</option><option value="translation">Translation only</option></select></div><label class="popup-cache"><span>Translation cache</span><input id="cache" type="checkbox" role="switch"></label></div>

<div class="popup-translate-row"><button class="primary popup-translate" id="translate-page">Translate <span class="shortcut">(Alt+Shift+T)</span></button><button class="ghost popup-restore" id="page.restore" title="Show original" aria-label="Show original">↩</button></div>
<div class="popup-features"><button id="documents">▤ <span>Documents</span></button><button id="text">文 <span>Text</span></button><button id="hover-toggle" aria-pressed="true">↖ <span>Hover</span></button><button id="translate-selection">▧ <span>Text selection</span></button></div>
<details class="popup-more"><summary>More features</summary><div class="actions"><button id="translate-input">Translate input</button><button id="captions.toggle">Video captions</button><button id="images">Image translation</button><button id="live">Live translation</button></div></details>
<p class="status" id="status" role="status"></p><div class="popup-footer"><button class="ghost" id="workspace">Settings ↗</button><span>UI by <a href="https://rareui.com" target="_blank" rel="noopener noreferrer">Rare UI</a></span></div><script type="module" src="popup.js"></script></body></html>
