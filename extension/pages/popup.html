<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Translate</title><link rel="stylesheet" href="rare.css"><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<header class="popup-header"><div class="brand"><img class="mark" src="assets/identity.svg" alt="">Open Translate</div><span class="eyebrow">READ / WORK / CONNECT</span></header>
<section class="popup-engine" aria-label="Translation engine"><div><span class="eyebrow">Your engine</span><button id="service">Connect your AI ↗</button></div><div id="popup-orb" class="popup-orb" aria-hidden="true"></div></section>
<div class="popup-languages"><div class="field"><label for="source">From</label><select id="source"></select></div><span aria-hidden="true">→</span><div class="field"><label for="target">Into</label><select id="target"></select></div></div><datalist id="languages"></datalist>
<div class="popup-translate-row"><button class="primary" id="translate-page">Translate this page <span aria-hidden="true">↗</span></button><button class="ghost" id="page.restore" title="Restore original page" aria-label="Restore original page">↶</button></div>
<div class="popup-preferences"><label for="mode">Reading view</label><select id="mode"><option value="bilingual">Bilingual</option><option value="translation">Translation only</option></select><label class="popup-cache"><input id="cache" type="checkbox" role="switch">Remember translations</label></div>
<p class="status" id="status" role="status"></p>
<div class="popup-tools" aria-label="Translation tools"><button id="translate-selection">Translate selection <span>Alt ⇧ S</span></button><button id="hover-toggle" aria-pressed="true">Paragraph shortcut <span>Alt ⇧ H</span></button><button id="documents">Open documents <span>PDF / EPUB / DOCX</span></button><button id="text">Open text workspace <span>↗</span></button></div>
<details class="popup-more"><summary>More tools</summary><div class="actions"><button id="translate-input">Translate input</button><button id="captions.toggle">Video captions</button><button id="images">Images & OCR</button><button id="live">Live translation</button></div></details>
<footer class="popup-footer"><button class="ghost" id="workspace">Preferences ↗</button><span>Components by <a href="https://rareui.com" target="_blank" rel="noopener noreferrer">Rare UI</a></span></footer>
<script type="module" src="popup.js"></script></body></html>
