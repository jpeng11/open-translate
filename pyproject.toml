[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-translate"
version = "0.2.0"
description = "Translate webpages and documents with your own AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
open-translate = "open_translate.cli:main"

[tool.setuptools.packages.find]
include = ["open_translate*"]
